name: keepwarm

# Supabase free tier pauses a project after 7 days idle. Ping PostgREST every 3 days
# so the project stays awake. cron is UTC; also runnable on demand.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL        - https://<ref>.supabase.co
#   SUPABASE_ANON_KEY   - anon (public) key

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase PostgREST root
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # Touch PostgREST (hits Postgres, which is what the 7-day pause is about).
        # -f: non-2xx fails the job, surfacing a paused/unhealthy project. PostgREST wants
        # both the apikey and a bearer token.
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/instruments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
