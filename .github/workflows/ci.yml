name: ci

# Gate for every PR and every push to main. Two jobs: unit (free — lint/test/build/deno) +
# smoke-evals (2 real /ask calls: one grounded case, one cross-version-leak case — see
# evals/run_evals.py's SMOKE_CASE_IDS). deploy.yml won't publish a commit whose ci run
# failed, so this is what actually gates a deploy.
#
# The FULL suite (RAGAS + all 26 golden cases + 6 conversational multi-turn cases, ~100+
# calls, 25-30 min) does NOT run here — it used to run automatically on every push
# (`full-evals`), which meant a pure-SPA commit that never touched the pipeline still paid
# for and waited on the full suite, and a noisy RAGAS metric could block an unrelated
# deploy. It now lives ONLY in evals-nightly.yml: a daily cron, or on demand via
# `gh workflow run evals-nightly.yml` (or the Actions tab) before/after a real pipeline
# change. See CLAUDE.md's "Before spending LLM quota" section.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# LLM_BASE_URL, LLM_API_KEY.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm test:functions

  smoke-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - run: pip install -r evals/requirements.txt
      - name: run_evals --smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # exit 2 == LLM daily quota exhausted (pipeline healthy) -> warn, don't block.
        # exit 3 == /ask returned 401/403 -> real config break (bad secrets), fail loudly.
        run: |
          set +e
          python evals/run_evals.py --smoke
          ec=$?
          if [ "$ec" = "2" ]; then
            echo "::warning::smoke evals skipped — LLM daily quota exhausted (pipeline is healthy)"
            exit 0
          fi
          if [ "$ec" = "3" ]; then
            echo "::error::smoke evals could not run — /ask auth rejected; check SUPABASE_* secrets"
          fi
          exit "$ec"
