name: ci

# PR gate. Fast: unit tests (SPA + Edge Functions) + the quick eval check
# (abstention accuracy + cross-version-leak, ~25 /ask calls, no RAGAS).
# The full RAGAS suite runs in evals-nightly.yml.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm test:functions

  quick-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # /ask calls hit Groq free-tier backoff; ~20 calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - run: pip install -r evals/requirements.txt
      - name: run_evals --quick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # exit 2 == LLM daily quota exhausted (pipeline healthy) -> warn, don't block.
        # exit 3 == /ask returned 401/403 -> real config break (bad secrets), fail loudly.
        run: |
          set +e
          python evals/run_evals.py --quick
          ec=$?
          if [ "$ec" = "2" ]; then
            echo "::warning::quick evals skipped — LLM daily quota exhausted (pipeline is healthy)"
            exit 0
          fi
          if [ "$ec" = "3" ]; then
            echo "::error::quick evals could not run — /ask auth rejected; check SUPABASE_* secrets"
          fi
          exit "$ec"
