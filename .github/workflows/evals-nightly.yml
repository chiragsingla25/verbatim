name: evals-nightly

# THE full eval suite: cross-version-leak + abstention accuracy over all 26 golden cases +
# 6 conversational multi-turn cases + RAGAS faithfulness/context-precision (~100+ real LLM
# calls, 25-30 min). This is now the ONLY place it runs — ci.yml's automatic gate
# (smoke-evals) is deliberately just 2 calls, so this workflow is what actually exercises
# RAGAS and the full golden set. Runs on the daily cron below, or on demand any time before/
# after a real pipeline change: `gh workflow run evals-nightly.yml` (optionally
# `-f fail_under=0.6` to override the RAGAS threshold) or via the Actions tab. See
# CLAUDE.md's "Before spending LLM quota" section before triggering it manually.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# LLM_BASE_URL, LLM_API_KEY.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      fail_under:
        description: "RAGAS mean threshold"
        default: "0.80"

jobs:
  full-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements-ragas.txt
      - run: pip install -r evals/requirements-ragas.txt
      - name: run_evals (full)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # exit 2 == LLM daily quota exhausted -> the nightly is inconclusive, not failed.
        run: |
          set +e
          python evals/run_evals.py --fail-under "${{ inputs.fail_under || '0.80' }}"
          ec=$?
          if [ "$ec" = "2" ]; then
            echo "::warning::nightly evals inconclusive — LLM daily quota exhausted"
            exit 0
          fi
          exit "$ec"
