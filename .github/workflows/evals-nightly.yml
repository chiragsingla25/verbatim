name: evals-nightly

# The full eval suite: cross-version-leak + abstention accuracy + RAGAS faithfulness /
# context-precision. Many LLM calls — runs on a schedule (not per-PR) to stay inside the
# Groq free-tier limits. Also runnable on demand.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      fail_under:
        description: "RAGAS mean threshold"
        default: "0.80"

jobs:
  full-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements-ragas.txt
      - run: pip install -r evals/requirements-ragas.txt
      - name: run_evals (full)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # exit 2 == LLM daily quota exhausted -> the nightly is inconclusive, not failed.
        run: |
          set +e
          python evals/run_evals.py --fail-under "${{ inputs.fail_under || '0.80' }}"
          ec=$?
          if [ "$ec" = "2" ]; then
            echo "::warning::nightly evals inconclusive — LLM daily quota exhausted"
            exit 0
          fi
          exit "$ec"
