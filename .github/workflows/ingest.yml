name: ingest

# Triggered by the ingest-dispatch Edge Function (1d) via
#   POST /repos/<owner>/verbatim/dispatches
#   { "event_type": "ingest",
#     "client_payload": { "job_id": "<uuid>", "version_id": "<uuid>",
#                         "object_path": "v/<version_id>/source.pdf" } }
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                - https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   - service_role JWT (Storage download + DB writes; RLS bypassed)
#   SUPABASE_DB_URL             - postgresql://... session-pooler connection string

on:
  repository_dispatch:
    types: [ingest]

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A CPU-only Docling parse has a real, document-dependent ceiling that isn't a
    # simple function of page count (a dense reference-table document has been observed
    # taking far longer per page than a typical manual) -- an upload is a one-time cost,
    # not a per-query one, so this budget is generous by design: 335 min, chosen to sit
    # just below run.py's own 19800s (330min) watchdog, which sits below GitHub-hosted
    # runners' hard 360min job ceiling. run.py's watchdog always fires first and leaves
    # the job row in a clean 'failed' state; this timeout-minutes is only the backstop
    # if the watchdog thread itself somehow doesn't run. Per-batch progress logging
    # (ingest/parse.py) makes a long run observable in this job's log instead of opaque.
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      # Docling / transformers pull their layout + OCR weights (~0.5-1 GB) from the
      # Hugging Face hub on first use. Without this cache every dispatch re-downloads
      # them, which is the bulk of the wall-clock time. Keyed on the pinned deps so a
      # version bump busts it.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
            ~/.cache/torch
          key: ingest-models-${{ hashFiles('ingest/requirements.txt') }}
          restore-keys: |
            ingest-models-

      - name: Install ingestion deps
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion
        # client_payload values pass through env (not string-interpolated into the shell).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          VERSION_ID: ${{ github.event.client_payload.version_id }}
          OBJECT_PATH: ${{ github.event.client_payload.object_path }}
          # Watchdog trips before this job's own timeout-minutes (335) and well before
          # GitHub-hosted runners' hard 360min ceiling, so the job row is always left in
          # a terminal state ('failed') rather than stuck at 'parsing'. Matches run.py's
          # WATCHDOG_SECONDS default -- set explicitly here too so the two never drift.
          INGEST_WATCHDOG_SECONDS: "19800"
        run: >
          python -m ingest.run
          --job-id "$JOB_ID"
          --version-id "$VERSION_ID"
          --object-path "$OBJECT_PATH"
